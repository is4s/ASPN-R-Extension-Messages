    Return codes for pass or fail status when changing or setting a parameter in the parameter server.  
    Valid 0
    FAILED -1
    More return codes can be added and handled by the system.


name: param_logging
version: 1.0
system_type: standard
category: param_server
controlled: no
distribution: A
experimental: false
description: >
  A message intended for logging things that occur during a test to give further context in the future data analysis. Examples, Sensor A died at time 1445, sensor A came back online at 1449.  Heavy rain started coming down at 1500.
fields:
- name: elapsed_nsec
  type: int64
  units: nanoseconds
  description: >
    Whole number nanoseconds elapsed since timestamp's zero epoch. If negative, whole number nanoseconds until timestamp's zero epoch.

- name: value
  type: string
  description: >
    A string of text to be recorded in the log giving context to what has occurred in the log/experiment.
