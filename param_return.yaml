name: param_return
version: 1.0
system_type: standard
category: param_server
controlled: no
distribution: A
experimental: false
description: >

fields:
- name: elapsed_nsec
  type: int64
  units: nanoseconds
  description: >
    Whole number nanoseconds elapsed since timestamp's zero epoch. If negative, whole number nanoseconds until timestamp's zero epoch.

- name: num_entries
  type: int16
  description: >
    Number of group/key/value sets being sent in this message.

- name: group
  type: string[num_entries]
  description: >
    Name of the group the key and value belong to in the parameter server.

- name: key
  type: string[num_entries]
  description: >
    Key value of the paramter in the parameter server being referenced.

- name: value
  type: string[num_entries]
  description: >
    Value of the key in the parameter server.

- name: return_codes
  type: int8[num_entries]
  description: >
    Return codes for pass or fail status when changing or setting a parameter in the parameter server.
      Valid 0
      FAILED -1
    More return codes can be added and handled by the system.
